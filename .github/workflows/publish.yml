name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The app server: Next.js standalone output, no build tooling.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/app:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The one-shot migrator: needs the Prisma CLI and tsx, so it keeps the
      # full dependency tree and is a much larger image.
      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/migrate:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
