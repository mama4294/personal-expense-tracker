services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: finance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies migrations and seeds users, categories, and accounts, then exits.
  migrate:
    image: ghcr.io/mama4294/personal-expense-tracker/migrate:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD:-finance}@db:5432/finance
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_NAME: ${ADMIN_NAME:-Household}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/mama4294/personal-expense-tracker/app:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD:-finance}@db:5432/finance
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  studio:
    image: node:22-alpine
    working_dir: /workspace
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD:-finance}@db:5432/finance
    ports:
      - "5555:5555"
    volumes:
      - studio_source:/workspace
    command: >
      sh -c "apk add --no-cache git openssl &&
      if [ ! -f package.json ]; then
        git clone https://github.com/mama4294/personal-expense-tracker.git .;
      fi &&
      npm ci &&
      npx prisma studio --url=\"$$DATABASE_URL\" --port 5555 --browser none"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  studio_source:
