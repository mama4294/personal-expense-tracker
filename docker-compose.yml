services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: finance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies migrations and seeds users, categories, and accounts, then exits.
  migrate:
    image: ghcr.io/mama4294/personal-expense-tracker/migrate:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD:-finance}@db:5432/finance
      MATTHEW_PASSWORD: ${MATTHEW_PASSWORD:-changeme}
      GENEVIEVE_PASSWORD: ${GENEVIEVE_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/mama4294/personal-expense-tracker/app:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD:-finance}@db:5432/finance
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
